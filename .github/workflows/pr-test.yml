name: 'PR: Test'

on:
  push:
    branches:
      - '**'
      - '!main'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Flutter version mirrors .tool-versions (subosito can't read it directly).
      # Keep in sync with the `flutter` pin in /.tool-versions.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: squadquest
          POSTGRES_PASSWORD: squadquest
          POSTGRES_DB: squadquest_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squadquest -d squadquest_v2"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://squadquest:squadquest@localhost:5432/squadquest_v2
      JWT_SECRET: ci-secret-min-32-chars-aaaaaaaaaaaaaaaa
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions

      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run db:migrate
      - run: bun test
