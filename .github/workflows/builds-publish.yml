name: 'Builds: Publish Release'

on:
  release:
    types: [ published ]

  # Manual trigger for exercising the iOS job on its own against an existing
  # tag. Only ios-publish honours this -- builds-publish is pinned to the
  # release event so a manual run can never redeploy the web/Play Store.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to stamp the build as, e.g. v1.46.0 (code built is the ref you run from)'
        required: true
        type: string
      upload_to_testflight:
        description: 'Upload to TestFlight (off: archive and export only)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  pages: write
  contents: write

jobs:
  builds-publish:
    runs-on: ubuntu-latest

    # Only deploy for v1.* releases. Release workflows already run from the
    # tagged commit, but this documents intent and blocks a stray non-v1 tag
    # from publishing via the v1 pipeline. The event check keeps a manual
    # workflow_dispatch (meant for iOS alone) from republishing web/Android.
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v1.')

    steps:
      - uses: actions/checkout@v4

      - name: Place tag in environment
        run: |
          SOURCE_TAG="${GITHUB_REF:10}"
          echo "SOURCE_TAG=${SOURCE_TAG}" >> $GITHUB_ENV
          echo "BUILD_NAME=${SOURCE_TAG#v}" >> $GITHUB_ENV

          # Count only v0.*/v1.* tags so future v2.* releases don't inflate the
          # v1 build number. Must include v0.* to stay monotonic with historical
          # builds (dropping them would regress below the last published build).
          BUILD_NUMBER="$(git ls-remote origin | grep -cE 'refs/tags/v[01]\.')"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_ENV

      - name: Write tag version to pubspec.yaml
        run: |
          sed -i "s/^version:.*/version: ${BUILD_NAME}+${BUILD_NUMBER}/" pubspec.yaml

      - name: Parse release notes
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          shopt -s extglob
          cargo install markdown-extract

          echo "Parsing release body:"
          echo "${RELEASE_BODY}"

          ## What's New
          RELEASE_NEWS=$(markdown-extract --no-print-matched-heading "What's New" <(echo "${RELEASE_BODY}") || echo '')
          RELEASE_NEWS="${RELEASE_NEWS##+([[:space:]])}"
          if [[ "${RELEASE_NEWS}" == "Error: No matches." ]]; then
              RELEASE_NEWS=""
          fi

          echo 'RELEASE_NEWS<<END_OF_RELEASE_MARKDOWN' >> $GITHUB_ENV
          echo "${RELEASE_NEWS}" >> $GITHUB_ENV
          echo 'END_OF_RELEASE_MARKDOWN' >> $GITHUB_ENV

          echo -e "News:\n${RELEASE_NEWS}\n"


          ## Notices
          RELEASE_NOTICES=$(markdown-extract --no-print-matched-heading "Notices" <(echo "${RELEASE_BODY}") || echo '')
          RELEASE_NOTICES="${RELEASE_NOTICES##+([[:space:]])}"
          if [[ "${RELEASE_NOTICES}" == "Error: No matches." ]]; then
              RELEASE_NOTICES=""
          fi

          echo 'RELEASE_NOTICES<<END_OF_RELEASE_MARKDOWN' >> $GITHUB_ENV
          echo "${RELEASE_NOTICES}" >> $GITHUB_ENV
          echo 'END_OF_RELEASE_MARKDOWN' >> $GITHUB_ENV

          echo -e "Notices:\n${RELEASE_NOTICES}\n"


          ## Write to file for Play Store upload
          mkdir /tmp/whatsnew
          echo "${RELEASE_NEWS}" > /tmp/whatsnew/whatsnew-en-US
          echo "Wrote news to /tmp/whatsnew/whatsnew-en-US"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter Version Management CLI
        uses: flutter-actions/setup-fvm@v1.0

      - name: Install Flutter SDK
        run: fvm install

      - name: Activate Flutter SDK
        run: fvm use --skip-pub-get

      - name: Get depedencies
        run: fvm flutter pub get

      - name: Write secret files
        run: |
          echo "${{ secrets.FLUTTER_ENV_BASE64 }}" | base64 -d > ./.env
          echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 -d > ./android/app/google-services.json
          echo "${{ secrets.ANDROID_KEY_PROPERTIES_BASE64 }}" | base64 -d > ./android/key.properties
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ./android/app/keystore.jks

      - name: Build for web
        run: fvm flutter build web --dart-define=PRODUCTION_LOGGING=true
        # run: fvm flutter build web --profile --source-maps --dart-define=Dart2jsOptimization=O0 --dart-define=PRODUCTION_LOGGING=true

      - name: Create 404.html
        run: |
          cp build/web/index.html build/web/404.html

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Build APK for Android
        run: fvm flutter build apk --dart-define=PRODUCTION_LOGGING=true

      - name: Build App Bundle for Android
        run: fvm flutter build appbundle

      - name: Rename builds
        run: |
          mv "build/app/outputs/flutter-apk/app-release.apk" "build/app/outputs/flutter-apk/SquadQuest.apk"
          mv "build/app/outputs/bundle/release/app-release.aab" "build/app/outputs/bundle/release/SquadQuest.aab"

      - name: Upload APK to release
        uses: alexellis/upload-assets@0.4.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          asset_paths: '["build/app/outputs/flutter-apk/SquadQuest.apk", "build/app/outputs/bundle/release/SquadQuest.aab"]'

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}'
          packageName: app.squadquest
          releaseFiles: build/app/outputs/bundle/release/SquadQuest.aab
          track: production
          whatsNewDirectory: /tmp/whatsnew

      - name: Insert new row into app_versions
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_GITHUB_RELEASE_ACTION_TOKEN: ${{ secrets.SUPABASE_GITHUB_RELEASE_ACTION_TOKEN }}
        run: |
          REQUEST_BODY=$(
              jq --null-input \
                  --arg build "${BUILD_NUMBER}" \
                  --arg version "${BUILD_NAME}" \
                  --arg news "${RELEASE_NEWS}" \
                  --arg notices "${RELEASE_NOTICES}" \
                  '{
                      build: $build,
                      version: $version,
                      news: (if $news == "" then null else $news end),
                      notices: (if $notices == "" then null else $notices end),
                      availability: ["githubAPK", "web"]
                  }'
          )
          echo "Build request body:"
          echo "${REQUEST_BODY}" | jq

          echo "Inserting new row into app_versions..."
          curl --silent \
              -X POST 'https://supabase.squadquest.app/rest/v1/app_versions' \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_GITHUB_RELEASE_ACTION_TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=representation" \
              -d "${REQUEST_BODY}" | jq

      - name: Build Discord notification
        run: |
              jq --null-input \
                  --arg build "${BUILD_NUMBER}" \
                  --arg version "${BUILD_NAME}" \
                  --arg news "${RELEASE_NEWS}" \
                  --arg notices "${RELEASE_NOTICES}" \
                  '
                    [
                      {
                        title: "GitHub Release",
                        url: "https://github.com/SquadQuest/SquadQuest/releases/tag/v\($version)"
                      },
                      (if $news == "" then null else {
                        title: "News",
                        description: $news,
                        color: 10798649
                      } end),
                      (if $notices == "" then null else {
                        title: "Notices",
                        description: $notices,
                        color: 14177041
                      } end)
                    ]
                    | {
                        content: "Version \($version) (build \($build)) has been published for review!",
                        embeds: [.[] | values]
                    }
                  ' \
                  > /tmp/discord-message.json

      - name: Post Discord notification
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          raw-data: /tmp/discord-message.json

  # iOS runs as its own macOS job rather than inside builds-publish above, so a
  # signing failure can't take down the web/Android deploy that already works.
  #
  # Inert until the repo variable IOS_PUBLISH_ENABLED is set to 'true'. Also
  # needs, beyond what the Android job uses:
  #   vars.APPSTORE_ISSUER_ID            App Store Connect issuer ID
  #   vars.APPSTORE_API_KEY_ID           App Store Connect API key ID
  #   secrets.APPSTORE_API_PRIVATE_KEY   contents of AuthKey_<id>.p8
  #   secrets.APPLE_CERTIFICATE_BASE64   Apple Distribution cert as base64 .p12
  #   secrets.APPLE_CERTIFICATE_PASSWORD password for that .p12
  #   secrets.IOS_GOOGLE_SERVICES_BASE64 base64 GoogleService-Info.plist
  ios-publish:
    runs-on: macos-latest

    if: >-
      vars.IOS_PUBLISH_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch'
        || startsWith(github.event.release.tag_name, 'v1.')
      )

    steps:
      # Checks out the triggering ref: the tag on a release, and whatever
      # branch/tag the manual run was started from otherwise. Deliberately not
      # the `tag` input -- that is a version label only, and checking it out
      # would build a commit predating this workflow and its ExportOptions.
      - uses: actions/checkout@v7

      - name: Place tag in environment
        env:
          SOURCE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ "${SOURCE_TAG}" != v1.* ]]; then
            echo "Refusing to build '${SOURCE_TAG}': this pipeline is v1-only." >&2
            exit 1
          fi

          if [ ! -f ios/ExportOptions.plist ]; then
            echo "ios/ExportOptions.plist missing from $(git rev-parse --short HEAD)." >&2
            echo "Run this from a ref that has it, such as the v1 branch." >&2
            exit 1
          fi

          echo "SOURCE_TAG=${SOURCE_TAG}" >> $GITHUB_ENV
          echo "BUILD_NAME=${SOURCE_TAG#v}" >> $GITHUB_ENV

          # Counted exactly as the Android job counts it, so one release lands
          # on both stores with the same build number.
          BUILD_NUMBER="$(git ls-remote origin | grep -cE 'refs/tags/v[01]\.')"
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_ENV

      - name: Write tag version to pubspec.yaml
        run: |
          sed -i '' "s/^version:.*/version: ${BUILD_NAME}+${BUILD_NUMBER}/" pubspec.yaml

      - name: Parse release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the body off the release rather than the event payload, so a
          # manual run against an older tag still gets its notes. A tag with no
          # release (or none yet) just yields empty notes.
          RELEASE_BODY="$(gh release view "${SOURCE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" --json body --jq .body || echo '')"

          # TestFlight's "What to Test" allows 4000 characters, so this needs
          # none of the 500-char trimming the Play Store step demands.
          RELEASE_NEWS=$(printf '%s' "${RELEASE_BODY}" \
            | awk '/^## What.s New/{f=1;next} /^## /{f=0} f')

          echo 'RELEASE_NEWS<<END_OF_RELEASE_MARKDOWN' >> $GITHUB_ENV
          echo "${RELEASE_NEWS}" >> $GITHUB_ENV
          echo 'END_OF_RELEASE_MARKDOWN' >> $GITHUB_ENV

      - name: Set up Flutter Version Management CLI
        uses: flutter-actions/setup-fvm@v1.0

      - name: Install Flutter SDK
        run: fvm install

      - name: Activate Flutter SDK
        run: fvm use --skip-pub-get

      - name: Precache iOS artifacts
        run: fvm flutter precache --ios

      - name: Get depedencies
        run: fvm flutter pub get

      - name: Write secret files
        run: |
          echo "${{ secrets.FLUTTER_ENV_BASE64 }}" | base64 -d > ./.env

          # The iOS plist, NOT the android/app/google-services.json that
          # GOOGLE_SERVICES_BASE64 holds for the job above -- different file,
          # so it needs its own secret.
          echo "${{ secrets.IOS_GOOGLE_SERVICES_BASE64 }}" | base64 -d > ./ios/Runner/GoogleService-Info.plist

      - name: Install CocoaPods dependencies
        run: cd ios && pod install

      - name: Install Apple distribution certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Import our own certificate instead of letting
          # -allowProvisioningUpdates mint one: Apple caps distribution
          # certificates at 3 per account and CI would churn through them.
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 -d > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Write App Store Connect API key
        env:
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$API_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Configure Flutter build settings
        # Writes Generated.xcconfig (build mode + dart-defines) for the
        # xcodebuild steps below to pick up.
        run: fvm flutter build ios --release --config-only --dart-define=PRODUCTION_LOGGING=true

      - name: Archive
        env:
          API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          # xcodebuild rather than `flutter build ipa`, because only xcodebuild
          # accepts -allowProvisioningUpdates -- which is what lets Xcode
          # resolve a profile for Runner *and* the embedded ImageNotification
          # extension without a profile secret per target.
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "${API_KEY_ID}" \
            -authenticationKeyIssuerID "${API_ISSUER_ID}"

      - name: Export IPA
        env:
          API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "${API_KEY_ID}" \
            -authenticationKeyIssuerID "${API_ISSUER_ID}"

          # exportArchive names the .ipa after the product, so glob it rather
          # than guessing.
          IPA_PATH="$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)"
          echo "Exported ${IPA_PATH}"
          echo "IPA_PATH=${IPA_PATH}" >> $GITHUB_ENV

      - name: Upload to TestFlight
        # A manual run defaults to archive-and-export only: it proves the
        # signing path without burning the build number that the real release
        # for this tag will need (TestFlight rejects duplicates).
        if: github.event_name == 'release' || inputs.upload_to_testflight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ env.RELEASE_NEWS }}
          uses-non-exempt-encryption: 'false'

      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/private_keys"
