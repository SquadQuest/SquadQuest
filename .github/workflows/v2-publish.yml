name: 'V2: Publish'

on:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  v2-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter version mirrors .tool-versions (subosito can't read it directly).
      # Keep in sync with the `flutter` pin in /.tool-versions.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      # --pwa-strategy=none disables the offline-first service worker: it
      # otherwise serves a stale build until the second reload (and bypasses
      # DevTools "Disable cache"), so we ship without it.
      - name: Build web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --pwa-strategy=none \
            --dart-define=API_BASE_URL=https://api.squadquest.app \
            --dart-define=CLIENT_HEADER=web/1.0.0+${{ github.run_number }}

      - uses: 'google-github-actions/auth@v2'
        with:
          service_account: 'v2-github-action@squadquest-d8665.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/902139539375/locations/global/workloadIdentityPools/github/providers/v2-github-actions'

      - uses: 'google-github-actions/setup-gcloud@v3'

      - uses: 'google-github-actions/upload-cloud-storage@v2'
        with:
          path: 'app/build/web'
          destination: 'v2.squadquest.app'
          parent: false

      # Cache-Control: no-cache on every object so each load revalidates against
      # origin and deploys show up immediately. CDN is off and traffic is tiny,
      # so always-revalidate is cheap.
      - name: 'Set no-cache on all objects'
        run: gcloud storage objects update "gs://v2.squadquest.app/**" --cache-control="no-cache"

  # Build the server image and roll the Cloud Run service. Runs in parallel with
  # the web publish above; both authenticate via the same WIF provider (gated to
  # develop). The container migrates-on-startup against Cloud SQL (private IP), so
  # no separate migrate step is needed here.
  v2-backend:
    runs-on: ubuntu-latest
    env:
      REGION: us-central1
      AR_HOST: us-central1-docker.pkg.dev
      IMAGE_REPO: us-central1-docker.pkg.dev/squadquest-d8665/squadquest-backend/api
      SERVICE: squadquest-backend
    steps:
      - uses: actions/checkout@v4

      - uses: 'google-github-actions/auth@v2'
        with:
          service_account: 'v2-github-action@squadquest-d8665.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/902139539375/locations/global/workloadIdentityPools/github/providers/v2-github-actions'

      - uses: 'google-github-actions/setup-gcloud@v3'

      - name: 'Configure Docker for Artifact Registry'
        run: gcloud auth configure-docker "$AR_HOST" --quiet

      # GitHub runners are amd64, so a plain build matches Cloud Run (no buildx needed).
      - name: 'Build and push image'
        working-directory: server
        run: |
          IMAGE="${IMAGE_REPO}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: 'Deploy to Cloud Run'
        run: gcloud run deploy "$SERVICE" --image="$IMAGE" --region="$REGION" --quiet

  # Build the `dev`-flavor Android APK pointed at prod and publish it to the media
  # bucket as squadquest-dev-b<run_number>.apk (+ a stable -latest copy). The dev
  # flavor (app.squadquest.dev) installs alongside v1 on a device. See
  # specs/behaviors/ci-cd.md + architecture.md (build channels). Runs in parallel
  # with the web + backend jobs; same WIF auth (gated to develop).
  v2-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AGP 9 / Gradle 9.1 need JDK 17+. GitHub runners ship a JDK, but pin it
      # explicitly so the build doesn't drift with the runner image.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      # build number = the run number (monotonic, traceable back to this run).
      - name: Build dev APK (→ prod API)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --flavor dev \
            --dart-define=API_BASE_URL=https://api.squadquest.app \
            --dart-define=CLIENT_HEADER=android/1.0.0+${{ github.run_number }}

      - uses: 'google-github-actions/auth@v2'
        with:
          service_account: 'v2-github-action@squadquest-d8665.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/902139539375/locations/global/workloadIdentityPools/github/providers/v2-github-actions'

      - uses: 'google-github-actions/setup-gcloud@v3'

      # Publish a build-numbered artifact + overwrite the stable "latest" link to
      # the v2 frontend bucket under downloads/ (served via the LB at
      # https://v2.squadquest.app/downloads/...). Same bucket as the web build;
      # the CI SA already has write there. APK mime type so it installs in one tap;
      # no-cache on -latest so a new build is picked up immediately.
      - name: Publish APK
        run: |
          SRC=app/build/app/outputs/flutter-apk/app-dev-release.apk
          MIME=application/vnd.android.package-archive
          gcloud storage cp "$SRC" \
            "gs://v2.squadquest.app/downloads/squadquest-dev-b${{ github.run_number }}.apk" \
            --content-type="$MIME"
          gcloud storage cp "$SRC" \
            "gs://v2.squadquest.app/downloads/squadquest-dev-latest.apk" \
            --content-type="$MIME" --cache-control="no-cache"

  # Build the SquadQuest Dev iOS IPA (ad-hoc) + publish an OTA install page to the
  # v2 bucket alongside the APK. Gated on the IOS_PUBLISH_ENABLED repo variable so
  # the (paid) macOS runner is skipped until Apple signing is set up — flip the
  # variable on once the app.squadquest.dev provisioning profile + secrets exist.
  # Requires repo secrets: APPLE_CERTIFICATE_BASE64, APPLE_CERTIFICATE_PASSWORD,
  # APPLE_PROVISIONING_PROFILE_BASE64 (profile "SquadQuest Dev Ad Hoc" covering
  # app.squadquest.dev), APPLE_TEAM_ID. See specs/behaviors/ci-cd.md.
  v2-ipa:
    if: vars.IOS_PUBLISH_ENABLED == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      # iOS has no committed `dev` flavor (Android-only), so retarget the Runner to
      # the dev identity at build time: bundle id app.squadquest.dev + display name
      # "SquadQuest Dev". Only the app target's PRODUCT_BUNDLE_IDENTIFIER is rewritten
      # (RunnerTests lines are app.squadquest.RunnerTests and don't match).
      - name: Retarget Runner to the dev identity
        working-directory: app
        run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = app.squadquest;/PRODUCT_BUNDLE_IDENTIFIER = app.squadquest.dev;/g' \
            ios/Runner.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName SquadQuest Dev" ios/Runner/Info.plist

      - name: Install Apple certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 -d > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          # Provisioning profile must be filed under its own UUID for Xcode to find it.
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISION_PROFILE_BASE64" | base64 -d > "$PROFILE_PATH"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | grep -A1 UUID | grep string | sed 's/.*<string>//;s/<\/string>.*//')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

      - name: Build signed IPA (→ prod API)
        working-directory: app
        run: |
          flutter pub get
          # Substitute the team id into the export options (kept out of the repo).
          sed -i '' "s/__APPLE_TEAM_ID__/${{ secrets.APPLE_TEAM_ID }}/g" ios/ExportOptions-dev.plist
          flutter build ipa --release \
            --build-name=1.0.0 --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=https://api.squadquest.app \
            --dart-define=CLIENT_HEADER=ios/1.0.0+${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions-dev.plist
          mv build/ios/ipa/*.ipa build/ios/ipa/squadquest-dev.ipa

      - name: Stamp OTA manifest + install page
        working-directory: app
        run: |
          VERSION="1.0.0 (b${{ github.run_number }})"
          sed -i '' "s/__BUILD_VERSION__/${VERSION}/g" ios/ota/manifest.plist ios/ota/index.html

      - uses: 'google-github-actions/auth@v2'
        with:
          service_account: 'v2-github-action@squadquest-d8665.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/902139539375/locations/global/workloadIdentityPools/github/providers/v2-github-actions'

      - uses: 'google-github-actions/setup-gcloud@v3'

      # Co-host the IPA next to the manifest so the OTA software-package URL is a
      # direct HTTPS download (OTA install breaks on redirects). manifest.plist +
      # the install page land under downloads/ too; all no-cache so a new build
      # shows immediately. Install page: https://v2.squadquest.app/downloads/
      - name: Publish IPA + OTA install page
        working-directory: app
        run: |
          DL="gs://v2.squadquest.app/downloads"
          gcloud storage cp build/ios/ipa/squadquest-dev.ipa \
            "$DL/squadquest-dev-b${{ github.run_number }}.ipa" \
            --content-type="application/octet-stream"
          gcloud storage cp build/ios/ipa/squadquest-dev.ipa \
            "$DL/squadquest-dev-latest.ipa" \
            --content-type="application/octet-stream" --cache-control="no-cache"
          gcloud storage cp ios/ota/manifest.plist "$DL/manifest.plist" \
            --content-type="text/xml" --cache-control="no-cache"
          gcloud storage cp ios/ota/index.html "$DL/index.html" \
            --content-type="text/html" --cache-control="no-cache"
