name: 'V2: Publish'

on:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  v2-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter version mirrors .tool-versions (subosito can't read it directly).
      # Keep in sync with the `flutter` pin in /.tool-versions.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      # --pwa-strategy=none disables the offline-first service worker: it
      # otherwise serves a stale build until the second reload (and bypasses
      # DevTools "Disable cache"), so we ship without it.
      - name: Build web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --pwa-strategy=none

      - uses: 'google-github-actions/auth@v2'
        with:
          service_account: 'v2-github-action@squadquest-d8665.iam.gserviceaccount.com'
          workload_identity_provider: 'projects/902139539375/locations/global/workloadIdentityPools/github/providers/v2-github-actions'

      - uses: 'google-github-actions/setup-gcloud@v3'

      - uses: 'google-github-actions/upload-cloud-storage@v2'
        with:
          path: 'app/build/web'
          destination: 'v2.squadquest.app'
          parent: false

      # Cache-Control: no-cache on every object so each load revalidates against
      # origin and deploys show up immediately. CDN is off and traffic is tiny,
      # so always-revalidate is cheap.
      - name: 'Set no-cache on all objects'
        run: gcloud storage objects update "gs://v2.squadquest.app/**" --cache-control="no-cache"
