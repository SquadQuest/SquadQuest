name: 'V2: Publish'

on:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  v2-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter Version Management CLI
        uses: flutter-actions/setup-fvm@v1.0

      - name: Install Flutter SDK
        run: fvm install

      - name: Activate Flutter SDK
        run: fvm use --skip-pub-get

      - name: Get depedencies
        run: fvm flutter pub get

      - name: Generate .env
        run: touch .env

      - name: Replace index.html with v2-index.html
        run: mv web/v2-index.html web/index.html

      # --pwa-strategy=none disables the offline-first service worker. For a
      # fast-iterating demo it otherwise serves a stale build until the second
      # reload (and bypasses DevTools "Disable cache"), so we ship without it.
      - name: Build v2 for web
        run: fvm flutter build web --pwa-strategy=none --dart-define=PRODUCTION_LOGGING=true --target=lib/v2/main.dart

      - uses: 'google-github-actions/auth@v2'
        with:
            service_account: 'v2-github-action@squadquest-d8665.iam.gserviceaccount.com'
            workload_identity_provider: 'projects/902139539375/locations/global/workloadIdentityPools/github/providers/v2-github-actions'

      - uses: 'google-github-actions/upload-cloud-storage@v2'
        with:
            path: 'build/web'
            destination: 'v2.squadquest.app'
            parent: false
            # Always revalidate against origin so deploys show up immediately
            # (CDN is off and traffic is tiny, so this is cheap).
            headers: |-
              cache-control: 'no-cache'
